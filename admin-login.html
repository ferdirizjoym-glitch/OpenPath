<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in · Open Path</title><link rel="stylesheet" href="styles.css"><style>.auth{width:min(420px,calc(100% - 32px));margin:12vh auto;background:var(--surface,#fff);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.auth h1{font-size:30px;margin:0 0 8px}.auth p{color:var(--muted)}.auth label{display:block;margin:14px 0 5px;font-weight:650}.auth input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}.auth button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:9px;background:var(--green);color:white;font-weight:750}.auth a{color:var(--green)}#message{color:#a33}</style></head><body><main class="auth"><a href="/">← Open Path</a><h1>Admin sign in</h1><p>Sign in to review community requests and manage destinations.</p><form id="login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="message" role="status"></p></form><p id="setup" hidden>No admin account yet? <a href="/admin/protected">Set up the first admin</a>.</p></main><script>fetch('/api/auth/status').then(r=>r.json()).then(s=>document.querySelector('#setup').hidden=!s.setupRequired);document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(r.ok){location.href='/admin/dashboard'}else document.querySelector('#message').textContent=d.error}</script></body></html>
