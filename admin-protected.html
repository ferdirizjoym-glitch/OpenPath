<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protected admin setup · Open Path</title><link rel="stylesheet" href="/styles.css"><style>.auth{width:min(480px,calc(100% - 32px));margin:8vh auto;background:var(--surface,#fff);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.auth h1{font-size:28px;margin:0 0 8px}.auth p{color:var(--muted)}.auth label{display:block;margin:14px 0 5px;font-weight:650}.auth input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}.auth button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:9px;background:var(--green);color:white;font-weight:750}.account{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}.account button{width:auto;margin:0;padding:6px 10px;background:#984838}#setup-token-field[hidden]{display:none}</style></head><body><main class="auth"><a href="/">← Open Path</a><h1>Admin accounts</h1><p id="description">Create the first admin account for Open Path.</p><form id="create"><label>Username<input name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required></label><label>Password (at least 10 characters)<input name="password" type="password" minlength="10" autocomplete="new-password" required></label><div id="setup-token-field" hidden><label>One-time Vercel setup token<input name="setupToken" type="password" autocomplete="off"></label></div><button id="save">Create admin account</button><p id="message" role="status"></p></form><section id="accounts" hidden><h2>Saved admin accounts <span id="account-count"></span></h2><p class="admin-note">These usernames are saved on this computer. Passwords are never displayed.</p><div id="list">Loading saved accounts…</div><h2>Add another admin</h2><form id="add"><label>Username<input name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required></label><label>Password (at least 10 characters)<input name="password" type="password" minlength="10" autocomplete="new-password" required></label><button>Add admin</button><p class="msg" role="status"></p></form></section><p><a href="/admin/login">Go to admin sign in</a></p></main><script>
const $=s=>document.querySelector(s);async function status(){const s=await fetch('/api/auth/status').then(r=>r.json());if(s.setupRequired){if(s.storageRequired){$('#create').hidden=true;$('#message').textContent='Connect Upstash Redis to this Vercel project before setting up admin access.';return;}if(s.setupTokenRequired){$('#setup-token-field').hidden=false;$('#setup-token-field input').required=true}else if(s.hosted){$('#create').hidden=true;$('#message').textContent='Set OPENPATH_SETUP_TOKEN in Vercel before creating the first admin.'}return;}$('#description').textContent='You must be signed in to manage admin accounts.';$('#create').hidden=true;if(!s.signedIn){$('#accounts').innerHTML='<p>Please <a href="/admin/login">sign in</a> to manage admin accounts.</p>';$('#accounts').hidden=false;return}$('#create').hidden=true;$('#accounts').hidden=false;refresh()};async function refresh(){const r=await fetch('/api/admins');if(!r.ok){$('#list').textContent='Could not load saved accounts. Please sign in again.';return}const admins=await r.json();$('#description').textContent='Add or remove administrator accounts. Passwords are stored as salted hashes.';$('#account-count').textContent='('+admins.length+')';$('#list').innerHTML=admins.length?'':'<p>No saved admin accounts.</p>';admins.forEach(a=>{const row=document.createElement('div');row.className='account';const name=document.createElement('span');name.textContent=a.username;const b=document.createElement('button');b.textContent='Remove';b.onclick=async()=>{if(!confirm('Remove admin '+a.username+'?'))return;const d=await fetch('/api/admins/'+encodeURIComponent(a.username),{method:'DELETE'});const x=await d.json();if(!d.ok)alert(x.error);refresh()};row.append(name,b);$('#list').append(row)})};async function create(form){const d=Object.fromEntries(new FormData(form));const r=await fetch('/api/admins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const out=await r.json();if(!r.ok){form.querySelector('.msg,#message').textContent=out.error;return}if($('#create')===form){$('#message').textContent='First admin created. Sign in to continue.';form.reset()}else{form.reset();form.querySelector('.msg').textContent='Admin account created.';refresh()}}$('#create').onsubmit=e=>{e.preventDefault();create(e.target)};$('#add').onsubmit=e=>{e.preventDefault();create(e.target)};status();
</script></body></html>
